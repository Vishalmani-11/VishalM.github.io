<script>
// Writeups page specific logic
let allWriteups = [];
let filteredWriteups = [];
let displayedCount = 10;
let currentCategory = '';
let currentDifficulty = '';

async function initWriteupsPage() {
  await window.loadAllData();
  allWriteups = window.writeupsData || [];
  
  renderCategoryFilters();
  filterWriteups();
  
  document.getElementById('writeup-search')?.addEventListener('input', () => filterWriteups());
}

function setCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('#category-filters .filter-chip').forEach(el => {
    el.classList.toggle('active', el.textContent.includes(cat) || (cat === '' && el.textContent === 'All categories'));
  });
  filterWriteups();
}

function setDifficulty(diff) {
  currentDifficulty = diff;
  document.querySelectorAll('#difficulty-filters .filter-chip').forEach(el => {
    el.classList.toggle('active', el.textContent.includes(currentDifficulty) || (diff === '' && el.textContent === 'All difficulties'));
  });
  filterWriteups();
}

function renderCategoryFilters() {
  const container = document.getElementById('category-filters');
  if (!container) return;
  
  const categories = [...new Set(allWriteups.map(w => w.category).filter(Boolean))];
  container.replaceChildren(
    create('span', { class: 'filter-chip active', onclick: 'setCategory("")' }, 'All categories'),
    ...categories.map(cat => create('span', { class: 'filter-chip', onclick: `setCategory('${cat}')` }, cat))
  );
}

function filterWriteups() {
  const searchTerm = document.getElementById('writeup-search')?.value.toLowerCase() || '';
  
  filteredWriteups = allWriteups.filter(w => {
    const title = (w.title || '').toLowerCase();
    const summary = (w.summary || '').toLowerCase();
    const category = (w.category || '').toLowerCase();
    const platform = (w.platform || '').toLowerCase();
    const tags = (w.tags || []).join(' ').toLowerCase();
    const date = (w.date || '').toLowerCase();
    
    const matchesSearch = !searchTerm || title.includes(searchTerm) || summary.includes(searchTerm) || category.includes(searchTerm) || platform.includes(searchTerm) || tags.includes(searchTerm);
    const matchesCategory = !currentCategory || category === currentCategory.toLowerCase();
    const matchesDifficulty = !currentDifficulty || String(w.difficulty || 1) === currentDifficulty;
    
    return matchesSearch && matchesCategory && matchesDifficulty;
  });
  
  // Sort by date descending (newest first)
  filteredWriteups.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
  
  displayedCount = 10;
  renderWriteups();
}

function renderWriteups() {
  const container = document.getElementById('all-writeups');
  const loadMoreBtn = document.getElementById('load-more-btn');
  if (!container) return;
  
  if (filteredWriteups.length === 0) {
    container.replaceChildren(create('div', { class: 'empty-state' }, [
      create('h3', {}, 'No writeups found'),
      create('p', {}, 'Try adjusting your filters')
    ]));
    if (loadMoreBtn) loadMoreBtn.hidden = true;
    return;
  }
  
  const toShow = filteredWriteups.slice(0, displayedCount);
  container.replaceChildren(...toShow.map(w => {
    const date = w.date ? new Date(w.date).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : 'Unknown';
    const isSample = w.sample;
    const title = isSample ? create('span', {}, [w.title || 'Untitled', create('span', { class: 'sample-badge' }, 'Sample')]) : w.title || 'Untitled';
    
    return create('a', { 
      class: 'row',
      href: `writeup.html?slug=${w.slug}`
    }, [
      create('span', { class: 'd' }, date),
      create('div', {}, [
        create('b', {}, title),
        create('small', {}, w.summary || '')
      ]),
      create('span', { class: 'c' }, w.platform || w.category || 'Uncategorized'),
      difficultyBars(w.difficulty || 1)
    ]);
  }));
  
  // Show/hide load more button
  if (loadMoreBtn) {
    loadMoreBtn.hidden = displayedCount >= filteredWriteups.length;
  }
}

function loadMore() {
  displayedCount += 10;
  renderWriteups();
  document.getElementById('all-writeups')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// Initialize when DOM is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initWriteupsPage);
} else {
  initWriteupsPage();
}
</script>
